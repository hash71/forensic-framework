name: Research validation

on:
  push:
    paths:
      - "conference_paper/**"
      - "forensic-framework/**"
      - ".github/workflows/research-validation.yml"
  pull_request:
    paths:
      - "conference_paper/**"
      - "forensic-framework/**"
      - ".github/workflows/research-validation.yml"

permissions:
  contents: read

jobs:
  warrantlab-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: forensic-framework

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: forensic-framework/requirements-research.lock

      - name: Install locked research dependencies
        run: python -m pip install --requirement requirements-research.lock

      - name: Verify frozen benchmark
        run: python generate_warrant_benchmark.py --check-only

      - name: Run research test suite
        run: python -m pytest -q

      - name: Compile-check Python sources
        run: python -m compileall -q app *.py
