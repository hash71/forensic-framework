name: Research validation

on:
  push:
    paths:
      - "conference_paper/**"
      - "forensic-framework/**"
      - ".github/workflows/research-validation.yml"
  pull_request:
    paths:
      - "conference_paper/**"
      - "forensic-framework/**"
      - ".github/workflows/research-validation.yml"

permissions:
  contents: read

jobs:
  warrantlab-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: forensic-framework

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: forensic-framework/requirements-research.lock

      - name: Install locked research dependencies
        run: python -m pip install --requirement requirements-research.lock

      - name: Verify frozen benchmark
        run: python generate_warrant_benchmark.py --check-only

      - name: Run research test suite
        run: python -m pytest -q

      - name: Compile-check Python sources
        run: python -m compileall -q app *.py
